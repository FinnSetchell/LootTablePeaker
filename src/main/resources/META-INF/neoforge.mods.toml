modLoader = "javafml" #mandatory
loaderVersion = "[4,)" #mandatory
license = "${license}"

[[mods]] #mandatory
modId = "${id}" #mandatory
version = "${version}" #mandatory
displayName = "${name}" #mandatory
authors = "${author}" #optional
description = '''${description}''' #mandatory
# Everything this mod does is server-side, so clients must never be required to have it. Without
# this, NeoForge's mod-list handshake rejects any client that does not carry a matching version —
# which for a server-side dev tool means locking out every ordinary player. IGNORE_ALL_VERSION
# skips the comparison in both directions, so a vanilla client, a client with a different version,
# and a client with the same version all connect fine.
displayTest = "IGNORE_ALL_VERSION"

[[dependencies.${id}]] #optional
modId = "neoforge" #mandatory
type = "required" #mandatory
versionRange = "[${neo_loader},)" #mandatory
ordering = "NONE"
side = "BOTH"

[[dependencies.${id}]]
modId = "minecraft"
type = "required"
versionRange = "${minecraft}"
ordering = "NONE"
side = "BOTH"
