# Mod metadata and per-version dependencies.
# Gradle's own launch options stay in gradle.properties — they cannot be read from here.
#
# Tables are selected per node by `properties { tags(version, loader) }` in stonecutter.gradle.kts,
# so `deps.fabric_api` resolves to whatever the matching [fabric."<version>"] table declares.

mod.id = "loot_table_peeker"
mod.name = "Loot Table Peeker"
# Artifact stem for the fleet filename convention {ModName}-{loader}-{mc}-{version}.jar.
mod.archive_name = "LootTablePeeker"
mod.group = "com.finndog.loottablepeeker"
mod.version = "2.3.0"
mod.author = "FinnSetchell"
mod.license = "MIT"
mod.description = "A server-side developer tool that stops loot containers from opening, showing their loot table id or a rerollable preview of the loot instead."

# Loom variant for the obfuscated (pre-26.1) versions, applied by dev.kikugie.loom-back-compat.
# From 26.1 Minecraft ships unobfuscated and the plugin swaps to plain fabric-loom automatically.
loomx.loom_version = "1.17-SNAPSHOT"

deps.fabric_loader = "0.19.3"

# ------------------------------------------------------------------ 1.20.1 (Java 17)
["1.20.1"]
mod.mc_releases = ["1.20", "1.20.1"]
mod.pack_format = "15"
mod.java = "17"

[fabric."1.20.1"]
mod.mc_compat = ">=1.20 <1.20.2"
deps.fabric_api = "0.92.11+1.20.1"
deps.modmenu = "7.2.2"

# ------------------------------------------------------------------ 1.21.1 (Java 21)
["1.21.1"]
mod.mc_releases = ["1.21", "1.21.1"]
mod.pack_format = "34"
mod.java = "21"

[fabric."1.21.1"]
mod.mc_compat = ">=1.21 <1.21.2"
deps.fabric_api = "0.116.14+1.21.1"
deps.modmenu = "11.0.4"

[neoforge."1.21.1"]
mod.mc_compat = "[1.21, 1.21.2)"
deps.neo_loader = "21.1.244"

# ------------------------------------------------------------------ 1.21.10 (Java 21)
# Sits below the 1.21.11 renames (ResourceLocation -> Identifier, ResourceKey#location ->
# #identifier, the Commands permission set) but above the 1.21.5 GameTest rework, so it reuses
# branches that already existed rather than adding any.
["1.21.10"]
mod.mc_releases = ["1.21.10"]
mod.pack_format = "69"
mod.java = "21"

[fabric."1.21.10"]
mod.mc_compat = ">=1.21.10 <1.21.11"
deps.fabric_api = "0.138.3+1.21.10"
deps.modmenu = "16.0.1"

[neoforge."1.21.10"]
mod.mc_compat = "[1.21.10, 1.21.11)"
deps.neo_loader = "21.10.64"

# ------------------------------------------------------------------ 1.21.11 (Java 21)
["1.21.11"]
mod.mc_releases = ["1.21.11"]
mod.pack_format = "75"
mod.java = "21"

[fabric."1.21.11"]
mod.mc_compat = ">=1.21.11 <1.21.12"
deps.fabric_api = "0.141.5+1.21.11"
deps.modmenu = "17.0.0"

[neoforge."1.21.11"]
mod.mc_compat = "[1.21.11, 1.21.12)"
deps.neo_loader = "21.11.44"

# ------------------------------------------------------------------ 26.1.2 (Java 25, unobfuscated)
["26.1.2"]
mod.mc_releases = ["26.1", "26.1.1", "26.1.2"]
mod.pack_format = "84"
mod.java = "25"

[fabric."26.1.2"]
mod.mc_compat = ">=26.1 <26.2"
deps.fabric_api = "0.155.2+26.1.2"
deps.modmenu = "18.0.0"

[neoforge."26.1.2"]
mod.mc_compat = "[26.1, 26.2)"
deps.neo_loader = "26.1.2.87"

# ------------------------------------------------------------------ 26.2 (Java 25, unobfuscated)
["26.2"]
mod.mc_releases = ["26.2"]
mod.pack_format = "88"
mod.java = "25"

[fabric."26.2"]
mod.mc_compat = ">=26.2 <26.3"
deps.fabric_api = "0.155.2+26.2"
deps.modmenu = "20.0.1"

[neoforge."26.2"]
mod.mc_compat = "[26.2, 26.3)"
deps.neo_loader = "26.2.0.88"

# ------------------------------------------------------------------ 26.3 (Java 25, unobfuscated)
["26.3"]
mod.mc_releases = ["26.3"]
mod.pack_format = "97"
mod.java = "25"

[fabric."26.3"]
mod.mc_compat = ">=26.3 <26.4"
deps.fabric_api = "0.160.7+26.3"
# Mod Menu has no stable 26.3 build yet; the beta is the only one published for this version.
deps.modmenu = "21.0.0-beta.1"

[neoforge."26.3"]
# As with 26.2, every published 26.3.x NeoForge is still a beta.
mod.mc_compat = "[26.3, 26.4)"
deps.neo_loader = "26.3.0.4-beta"
