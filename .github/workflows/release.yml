name: Build and Release

on:
  push:
    tags:
      - 'v*'

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # The matrix spans three toolchains: 1.20.1 needs Java 17, the 1.21.x nodes 21,
      # and the 26.x nodes 25. Gradle picks the right one per node from mod.java in
      # stonecutter.properties.toml, so all three have to be present.
      - name: Set up JDKs
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: |
            17
            21
            25
          cache: gradle

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      # Unqualified, so Gradle runs it in every node project, collecting each jar into
      # build/libs/{mod version}/. Stonecutter generates each node's sources for its own
      # version independently of which version the checked-in tree is switched to.
      - name: Build all nodes
        run: ./gradlew buildAndCollect

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: build/libs/**/*.jar
          name: Release ${{ github.ref_name }}
          draft: false
          prerelease: false
          generate_release_notes: true
